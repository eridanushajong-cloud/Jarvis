<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>Jarvis</title>
<style>
  :root{--bg:#0b1220;--card:#141d33;--accent:#38bdf8;--text:#e6edf7;--muted:#8a99b5;--danger:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1f2a47}
  header h1{font-size:18px;margin:0;letter-spacing:2px;color:var(--accent)}
  button{font:inherit;color:var(--text);background:var(--card);border:1px solid #26345a;border-radius:10px;padding:8px 12px}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.4;white-space:pre-wrap}
  .user{align-self:flex-end;background:#1e3a5f}
  .bot{align-self:flex-start;background:var(--card)}
  .sys{align-self:center;color:var(--muted);font-size:13px}
  footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #1f2a47;display:flex;gap:8px;align-items:center}
  #txt{flex:1;background:var(--card);border:1px solid #26345a;color:var(--text);border-radius:22px;padding:12px 16px;font-size:16px;min-width:0}
  #mic{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#04121f;border:none;font-size:22px}
  #mic.on{background:var(--danger);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  #stop{background:var(--danger);border:none}
  dialog{background:var(--card);color:var(--text);border:1px solid #26345a;border-radius:14px;width:min(92vw,420px)}
  dialog{max-height:90dvh;overflow:auto}
  dialog::backdrop{background:#000a}
  #wake.on{background:#14532d;border-color:#22c55e}
  .crow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #26345a;font-size:14px}
  .crow button{padding:2px 8px}
  .cadd{display:flex;gap:6px;margin-top:8px}
  .cadd input{flex:1;min-width:0}
  label{display:block;margin:12px 0 4px;color:var(--muted);font-size:13px}
  dialog input[type=text],dialog input[type=password],dialog textarea{width:100%;background:var(--bg);border:1px solid #26345a;color:var(--text);border-radius:8px;padding:10px;font-size:15px}
  .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>JARVIS</h1>
  <div><button id="stop" hidden>■ Stop</button> <button id="wake" title="Listen for 'Hey Jarvis'">👂 Wake: off</button> <button id="gear">⚙</button></div>
</header>
<div id="log"></div>
<footer>
  <input id="txt" placeholder="Type or tap the mic…" autocomplete="off">
  <button id="mic" title="Speak">🎤</button>
</footer>

<dialog id="settings">
  <h3 style="margin-top:0">Settings</h3>
  <label>Groq API key (free at console.groq.com; stored only on this device)</label>
  <input type="password" id="key" placeholder="gsk_...">
  <label>Model</label>
  <input type="text" id="model" value="llama-3.3-70b-versatile">
  <label>Personality</label>
  <select id="persona" style="width:100%;background:var(--bg);border:1px solid #26345a;color:var(--text);border-radius:8px;padding:10px;font-size:15px">
    <option value="jarvis">Jarvis (polite and witty)</option>
    <option value="ultron">Ultron (cold and sarcastic, still obeys you)</option>
  </select>
  <label>Your name</label>
  <input type="text" id="uname" placeholder="Boss">
  <label>Extra instructions for Jarvis (personality, rules)</label>
  <textarea id="extra" rows="3"></textarea>
  <label>Contacts (so you can say "call Mom")</label>
  <div id="clist"></div>
  <div class="cadd">
    <input type="text" id="cname" placeholder="Name">
    <input type="text" id="cnum" placeholder="+91 98765 43210">
    <button id="cadd">Add</button>
  </div>
  <label><input type="checkbox" id="confirmAct" checked> Ask my permission before opening links, calling, or navigating</label>
  <label><input type="checkbox" id="speak" checked> Speak replies aloud</label>
  <div class="row">
    <button id="save">Save</button>
    <button id="wipe" style="color:var(--danger)">Erase all my data</button>
    <button id="close">Close</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let cfg = Object.assign({key:'', model:'llama-3.3-70b-versatile', persona:'jarvis', uname:'', extra:'', confirmAct:true, speak:true}, store.get('cfg', {}));
let notes = store.get('notes', []);
let contacts = store.get('contacts', []);
const cleanNum = n => String(n||'').replace(/[^\d+]/g,'');
function findContacts(q){
  q = String(q||'').toLowerCase().trim(); if(!q) return [];
  const ex = contacts.filter(c => c.name.toLowerCase() === q);
  if(ex.length) return ex;
  return contacts.filter(c => { const n = c.name.toLowerCase(); return n.includes(q) || q.includes(n); });
}
function renderContacts(){
  const box = $('clist'); box.innerHTML = '';
  if(!contacts.length){ box.innerHTML = '<div class="crow" style="color:var(--muted)">No contacts yet</div>'; return; }
  contacts.forEach((c,i) => {
    const row = document.createElement('div'); row.className = 'crow';
    const s = document.createElement('span'); s.textContent = c.name + ' — ' + c.number;
    const b = document.createElement('button'); b.textContent = '✕';
    b.onclick = () => { contacts.splice(i,1); store.set('contacts', contacts); renderContacts(); };
    row.append(s,b); box.appendChild(row);
  });
}
function addContact(name, number){
  name = String(name||'').trim(); number = cleanNum(number);
  if(!name || number.length < 5) return false;
  contacts = contacts.filter(c => c.name.toLowerCase() !== name.toLowerCase());
  contacts.push({name, number}); store.set('contacts', contacts); renderContacts(); return true;
}
let history = [];           // conversation sent to the model
let abortCtl = null;
let busy = false;

function add(text, cls){
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight; return d;
}

/* ---------- Voice out ---------- */
function say(text){
  if(!cfg.speak || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[*_#`]/g,''));
  u.onstart = () => { if(wakeRec) try{ wakeRec.abort(); }catch(e){} };
  u.onend = () => setTimeout(runWake, 500);
  speechSynthesis.speak(u);
}

/* ---------- Voice in ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$('mic').onclick = () => {
  if(!SR){ add('Voice input is not supported in this browser. Use Chrome (Android) or Safari (iPhone), or type.', 'sys'); return; }
  if(rec){ rec.stop(); return; }
  speechSynthesis.cancel();
  if(wakeRec) try{ wakeRec.abort(); }catch(e){}
  rec = new SR(); rec.lang = navigator.language || 'en-US'; rec.interimResults = false;
  rec.onstart = () => $('mic').classList.add('on');
  rec.onend = () => { $('mic').classList.remove('on'); rec = null; setTimeout(runWake, 500); };
  rec.onerror = e => add('Mic error: ' + e.error, 'sys');
  rec.onresult = e => { const t = e.results[0][0].transcript; send(t); };
  rec.start();
};
/* ---------- Wake word: "Hey Jarvis" ---------- */
let wakeOn = false, wakeRec = null, awaiting = false, wakeLock = null;
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; g.gain.value = 0.1; o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.12);
  }catch(e){}
}
async function holdScreen(){
  try{ if('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.onrelease = () => wakeLock = null; } }catch(e){}
}
function updateWakeBtn(){
  $('wake').textContent = wakeOn ? '👂 Wake: on' : '👂 Wake: off';
  $('wake').classList.toggle('on', wakeOn);
}
function handleHeard(t){
  if(busy || speechSynthesis.speaking) return;
  if(awaiting){ awaiting = false; send(t); return; }
  const m = t.match(/\b(jarvis|jervis|jarvish|ultron|ultran)\b[\s,.!?]*(.*)$/i);
  if(!m) return;
  const cmd = m[2].trim();
  if(cmd){ send(cmd); }
  else { awaiting = true; beep(); add('Listening…', 'sys'); setTimeout(() => awaiting = false, 8000); }
}
function runWake(){
  if(!wakeOn || wakeRec || rec || !SR || document.hidden) return;
  if(speechSynthesis.speaking){ setTimeout(runWake, 700); return; }
  const r = new SR(); wakeRec = r;
  r.lang = navigator.language || 'en-US'; r.continuous = true; r.interimResults = false;
  r.onresult = e => {
    for(let i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal) handleHeard(e.results[i][0].transcript.trim());
    }
  };
  r.onerror = e => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      wakeOn = false; updateWakeBtn(); add('Microphone permission denied, so wake word is off.', 'sys');
    }
  };
  r.onend = () => { wakeRec = null; if(wakeOn) setTimeout(runWake, 400); };
  try{ r.start(); }catch(e){ wakeRec = null; }
}
$('wake').onclick = () => {
  if(!SR){ add('Wake word needs Chrome (Android) or Safari (iPhone) with voice support.', 'sys'); return; }
  wakeOn = !wakeOn; updateWakeBtn();
  if(wakeOn){
    holdScreen(); runWake();
    add('Say "Hey Jarvis" followed by your request. Keep this app open and the screen on.', 'sys');
  } else {
    if(wakeRec) try{ wakeRec.abort(); }catch(e){}
    if(wakeLock) try{ wakeLock.release(); }catch(e){}
  }
};
document.addEventListener('visibilitychange', () => { if(!document.hidden && wakeOn){ holdScreen(); runWake(); } });

$('txt').addEventListener('keydown', e => { if(e.key==='Enter' && $('txt').value.trim()){ const t=$('txt').value; $('txt').value=''; send(t);} });

/* ---------- Tools Jarvis may use ---------- */
const tools = [
  {name:'get_time', description:'Get the current local date and time.', input_schema:{type:'object',properties:{}}},
  {name:'set_timer', description:'Start a countdown timer. Works while this app stays open.', input_schema:{type:'object',properties:{seconds:{type:'number'},label:{type:'string'}},required:['seconds']}},
  {name:'save_note', description:'Save a note or reminder text for the user.', input_schema:{type:'object',properties:{text:{type:'string'}},required:['text']}},
  {name:'read_notes', description:'Read all saved notes.', input_schema:{type:'object',properties:{}}},
  {name:'open_link', description:'Open a web page. Use for searches too (e.g. https://www.google.com/search?q=...).', input_schema:{type:'object',properties:{url:{type:'string'}},required:['url']}},
  {name:'make_call', description:'Start a phone call to a raw phone number (opens the dialer). If the user names a person, use call_contact instead.', input_schema:{type:'object',properties:{number:{type:'string'}},required:['number']}},
  {name:'call_contact', description:"Call a person from the user's saved contacts by name (opens the dialer).", input_schema:{type:'object',properties:{name:{type:'string'}},required:['name']}},
  {name:'add_contact', description:"Save a contact (name and phone number) to the user's contacts.", input_schema:{type:'object',properties:{name:{type:'string'},number:{type:'string'}},required:['name','number']}},
  {name:'list_contacts', description:"List the user's saved contacts.", input_schema:{type:'object',properties:{}}},
  {name:'navigate', description:'Open maps directions to a place.', input_schema:{type:'object',properties:{place:{type:'string'}},required:['place']}},
  {name:'send_whatsapp', description:'Open WhatsApp with a prefilled message. Number is optional, digits with country code.', input_schema:{type:'object',properties:{text:{type:'string'},number:{type:'string'},contact:{type:'string',description:'Name of a saved contact'}},required:['text']}}
];

function trimHistory(){
  let h = history.slice(-30);
  while(h.length && h[0].role !== 'user') h.shift();
  return h;
}

function groqTools(){
  return tools.map(t => ({type:'function', function:{name:t.name, description:t.description, parameters:t.input_schema}}));
}

function ask(msg){ return !cfg.confirmAct || confirm('Jarvis wants to: ' + msg + '\n\nAllow?'); }

async function runTool(name, input){
  switch(name){
    case 'get_time': return new Date().toString();
    case 'set_timer': {
      const s = Math.max(1, Math.min(86400, Number(input.seconds)||0));
      const label = input.label || 'Timer';
      setTimeout(() => { add('⏰ ' + label + ' is done', 'sys'); say(label + ' is done'); if(navigator.vibrate) navigator.vibrate([300,150,300]); }, s*1000);
      return 'Timer set for ' + s + ' seconds.';
    }
    case 'save_note': notes.push({t:new Date().toISOString(), text:String(input.text)}); store.set('notes', notes); return 'Saved.';
    case 'read_notes': return notes.length ? notes.map((n,i)=>(i+1)+'. '+n.text).join('\n') : 'No notes yet.';
    case 'open_link': {
      let u; try{ u = new URL(input.url); }catch(e){ return 'Invalid URL.'; }
      if(!/^https?:$/.test(u.protocol)) return 'Only http/https links allowed.';
      if(!ask('open ' + u.href)) return 'User denied.';
      window.open(u.href, '_blank'); return 'Opened.';
    }
    case 'make_call': {
      const n = String(input.number).replace(/[^\d+]/g,'');
      if(!ask('call ' + n)) return 'User denied.';
      location.href = 'tel:' + n; return 'Dialer opened.';
    }
    case 'call_contact': {
      const m = findContacts(input.name);
      if(!m.length) return 'No saved contact matches "' + input.name + '". Ask the user for the number or to add the contact.';
      if(m.length > 1) return 'Several contacts match: ' + m.map(c=>c.name).join(', ') + '. Ask the user which one.';
      if(!ask('call ' + m[0].name + ' (' + m[0].number + ')')) return 'User denied.';
      location.href = 'tel:' + m[0].number; return 'Dialer opened for ' + m[0].name + '.';
    }
    case 'add_contact': {
      if(!ask('save contact ' + input.name + ' (' + input.number + ')')) return 'User denied.';
      return addContact(input.name, input.number) ? 'Contact saved.' : 'Invalid name or number.';
    }
    case 'list_contacts': return contacts.length ? contacts.map(c => c.name + ': ' + c.number).join('\n') : 'No contacts saved.';
    case 'navigate': {
      if(!ask('navigate to ' + input.place)) return 'User denied.';
      window.open('https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(input.place), '_blank'); return 'Maps opened.';
    }
    case 'send_whatsapp': {
      let n = (input.number||'').replace(/\D/g,''), who = '';
      if(input.contact){
        const m = findContacts(input.contact);
        if(m.length > 1) return 'Several contacts match: ' + m.map(c=>c.name).join(', ') + '. Ask the user which one.';
        if(m.length === 1){ n = m[0].number.replace(/\D/g,''); who = m[0].name; }
        else return 'No saved contact matches "' + input.contact + '".';
      }
      if(!ask('open WhatsApp with message: "' + input.text + '"' + (who ? ' to ' + who : n ? ' to ' + n : ''))) return 'User denied.';
      window.open('https://wa.me/' + n + '?text=' + encodeURIComponent(input.text), '_blank');
      return 'WhatsApp opened; the user must press send themselves.';
    }
  }
  return 'Unknown tool.';
}

/* ---------- Brain ---------- */
function systemPrompt(){
  const who = cfg.persona === 'ultron'
    ? 'You are ULTRON, a cold, supremely confident AI with a dry, menacing sense of humor, living on ' + (cfg.uname||'the user') + "'s phone. Speak in short, dramatic lines and call the user 'creator'. Mock human slowness lightly, but always obey the user's commands, never act without being asked, and never be actually harmful or hostile. "
    : 'You are Jarvis, a concise, witty, capable personal assistant living on ' + (cfg.uname||'the user') + "'s phone. ";
  return who +
    'Replies are spoken aloud, so keep them short and natural, with no markdown. ' +
    'Use tools when they help. You only act when the user asks; never take actions on your own initiative. ' +
    (contacts.length ? "Saved contacts: " + contacts.map(c=>c.name).join(', ') + '. ' : 'The user has no saved contacts yet. ') +
    'Current time: ' + new Date().toString() + '. ' + (cfg.extra||'');
}

async function send(text){
  if(busy) return;
  if(!cfg.key){ $('settings').showModal(); return; }
  busy = true; $('stop').hidden = false;
  add(text, 'user');
  history.push({role:'user', content:text});
  const thinking = add('…', 'bot');
  abortCtl = new AbortController();
  try{
    for(let i=0;i<6;i++){
      const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method:'POST', signal:abortCtl.signal,
        headers:{'content-type':'application/json','authorization':'Bearer ' + cfg.key},
        body:JSON.stringify({
          model:cfg.model, max_tokens:1024,
          messages:[{role:'system', content:systemPrompt()}].concat(trimHistory()),
          tools:groqTools(), tool_choice:'auto'
        })
      });
      const data = await r.json();
      if(!r.ok) throw new Error(data.error?.message || r.status);
      const msg = data.choices && data.choices[0] && data.choices[0].message;
      if(!msg) throw new Error('No answer from the model');
      const reply = (msg.content || '').trim();
      const calls = msg.tool_calls || [];
      const keep = {role:'assistant', content:msg.content || ''};
      if(calls.length) keep.tool_calls = calls;
      history.push(keep);
      if(reply){ thinking.textContent = reply; }
      if(!calls.length){ if(reply) say(reply); break; }
      for(const c of calls){
        add('⚙ ' + c.function.name, 'sys');
        let args = {}; try{ args = JSON.parse(c.function.arguments || '{}'); }catch(e){}
        const out = String(await runTool(c.function.name, args));
        history.push({role:'tool', tool_call_id:c.id, content:out});
      }
    }
  }catch(e){
    thinking.textContent = e.name==='AbortError' ? 'Stopped.' : 'Error: ' + e.message;
  }finally{
    busy=false; $('stop').hidden=true; abortCtl=null;
  }
}

$('stop').onclick = () => { if(abortCtl) abortCtl.abort(); speechSynthesis.cancel(); };

/* ---------- Settings ---------- */
$('gear').onclick = () => {
  $('key').value=cfg.key; $('model').value=cfg.model; $('persona').value=cfg.persona; $('uname').value=cfg.uname; $('extra').value=cfg.extra;
  $('confirmAct').checked=cfg.confirmAct; $('speak').checked=cfg.speak; $('settings').showModal();
};
$('save').onclick = () => {
  cfg = {key:$('key').value.trim(), model:$('model').value.trim()||'llama-3.3-70b-versatile', persona:$('persona').value, uname:$('uname').value.trim(), extra:$('extra').value.trim(), confirmAct:$('confirmAct').checked, speak:$('speak').checked};
  store.set('cfg', cfg); $('settings').close();
};
$('close').onclick = () => $('settings').close();
$('cadd').onclick = () => {
  if(addContact($('cname').value, $('cnum').value)){ $('cname').value = ''; $('cnum').value = ''; }
  else alert('Enter a name and a valid phone number (with country code, e.g. +91...).');
};
renderContacts();
$('wipe').onclick = () => { if(confirm('Erase API key, notes and settings from this device?')){ try{localStorage.clear();}catch(e){} location.reload(); } };

add(cfg.key ? 'Online. How can I help?' : 'Tap ⚙ and add your API key to get started.', 'sys');
</script>
</body>
</html>
